<!DOCTYPE html>
<html>
<head>
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>This is snake fun game!</h1>
  <p><a href="index.html">Back to home</a></p>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <script>
    var canvas = document.getElementById("gameCanvas");
    var ctx = canvas.getContext("2d");
    var CELL = 20;
 
    var snake = { x: 1, y: 0 };
 
    function drawBoard() {
  ctx.fillStyle = "#E3971E";
  ctx.fillRect(0, 0, 400, 400);
 
  ctx.fillStyle = "#D9BE3B";
  ctx.fillRect(snake.x, snake.y, 20, 20);
}
 setInterval(step, 120);
    function step() {
  snake.x = snake.x + 20;
        if (snake.x > 380) {
    snake.x = 0;
  }

  drawBoard();
}


drawBoard();
    


  </script>



</body>
</html>
